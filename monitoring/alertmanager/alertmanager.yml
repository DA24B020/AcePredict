route:
  receiver: log-only
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
  routes:
    # Drift / quality alerts call the backend, which queues a retraining run.
    - matchers: ['action="retrain"']
      receiver: retrain-webhook

receivers:
  - name: log-only
  - name: retrain-webhook
    webhook_configs:
      - url: http://backend:8000/webhooks/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials: change-me-webhook-token   # must equal WEBHOOK_TOKEN in .env
