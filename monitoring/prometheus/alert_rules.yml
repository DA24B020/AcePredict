groups:
  - name: acepredict
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "AcePredict backend is down"}

      - alert: ModelServerDown
        expr: acepredict_model_server_up == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Model server not answering /ping"}

      - alert: HighErrorRate
        expr: >
          sum(rate(http_requests_total{job="backend",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_requests_total{job="backend"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "More than 5% of API requests fail"}

      - alert: HighLatencyP95
        expr: >
          histogram_quantile(0.95, sum by (le)
          (rate(http_request_duration_seconds_bucket{job="backend",handler="/predict"}[5m]))) > 0.3
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "p95 /predict latency above 300 ms"}

      - alert: FeatureDrift
        expr: max(acepredict_feature_psi) > 0.2
        for: 1m
        labels: {severity: warning, action: retrain}
        annotations: {summary: "Input features drifted from training data (PSI > 0.2)"}

      - alert: LiveLogLossHigh
        expr: acepredict_live_log_loss > 0.69 and acepredict_live_window_size >= 50
        for: 5m
        labels: {severity: warning, action: retrain}
        annotations: {summary: "Model no better than a coin flip on recent real results"}

      - alert: PipelineStageFailed
        expr: acepredict_stage_status == 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Pipeline stage {{ $labels.stage }} failed"}

      - alert: DiskAlmostFull
        expr: >
          1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"} > 0.9
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "VM disk more than 90% full"}
