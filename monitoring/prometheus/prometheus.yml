global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: [alert_rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: backend
    static_configs: [{targets: ["backend:8000"]}]
  - job_name: frontend
    static_configs: [{targets: ["frontend:8502"]}]
  - job_name: mlflow
    static_configs: [{targets: ["mlflow:5000"]}]
  - job_name: pushgateway          # pipeline stages and runner (batch jobs)
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
