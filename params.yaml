# Single source of truth for every pipeline parameter. DVC tracks these keys:
# changing one reruns only the stages that depend on it.

data:
  # github = download Jeff Sackmann's CSVs; sample = synthetic data in the same format
  source: github
  sackmann_ref: main          # pin a commit SHA here for exact reproducibility
  base_url_atp: https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/{ref}/atp
  base_url_wta: https://raw.githubusercontent.com/Aneeshers/tennis-sackmann-archive/{ref}/wta
  tours: [atp, wta]
  start_year: 1991              # Elo warm-up starts here
  end_year: 2026
  levels_exclude: [D]           # Davis Cup / team events
  # Matches on or after this date are held out as the "live" stream that the
  # season-replay script sends to the deployed app. Set to null to train on everything.
  holdout_from: "2026-01-01"
  download_timeout_s: 60

validation:
  max_invalid_fraction: 0.05

spark:
  master: local[4]
  driver_memory: 3g
  shuffle_partitions: 8

splits:
  train_start: 2000
  train_end: 2021
  val_years: [2022, 2023]
  test_years: [2024, 2025]

elo:
  initial: 1500
  k_c: 250.0
  k_offset: 5.0
  k_shape: 0.4
  surface_weight: 0.5
  use_tuned: true               # take the Ray Tune best params when available

tune:
  num_samples: 16
  num_cpus: 4
  dashboard: true               # Ray dashboard on :8265 while the stage runs
  object_store_mb: 400        # Ray object store size (fits the 1 GB /dev/shm in Docker)
  c_range: [150.0, 400.0]
  offset_range: [2.0, 10.0]
  shape_range: [0.2, 0.6]
  weight_range: [0.2, 0.8]

features:
  form_window: 10
  serve_window: 20
  seed: 42
  reference_sample: 5000

model:
  candidates: [logreg, lightgbm]
  logreg:
    C: 0.5
    max_iter: 1000
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 50

registry:
  name: acepredict
  gate_tolerance: 0.0           # challenger must not be worse than champion on test log-loss

mlflow:
  experiment: acepredict
  tuning_experiment: acepredict-elo-tuning
