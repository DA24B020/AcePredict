# AcePredict stack. scripts/start.sh builds the images and starts everything.
# Frontend and backend are separate services linked only by REST (BACKEND_URL).
x-ml: &ml
  image: acepredict-ml:latest
  env_file: .env
  restart: unless-stopped

services:
  mlflow:
    <<: *ml
    build: {context: ., dockerfile: docker/ml.Dockerfile}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts --serve-artifacts
      --expose-prometheus /mlflow/prometheus
    volumes: [mlflow-data:/mlflow]
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      retries: 12
    mem_limit: 1g

  model-server:
    <<: *ml
    command: python -m acepredict.serving.serve_champion
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_SERVER_PORT: "5001"
    ports: ["5001:5001"]
    depends_on: {mlflow: {condition: service_healthy}}
    mem_limit: 1500m

  backend:
    <<: *ml
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_SERVER_URL: http://model-server:5001
    volumes:
      - ./:/app:ro
      - ./runtime:/app/runtime
    ports: ["8000:8000"]
    depends_on: {mlflow: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      retries: 6
    mem_limit: 1g

  frontend:
    build: {context: ., dockerfile: docker/frontend.Dockerfile}
    image: acepredict-frontend:latest
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
    restart: unless-stopped
    mem_limit: 512m

  pipeline-runner:
    <<: *ml
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    command: python -m acepredict.pipeline.runner
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PUSHGATEWAY_URL: pushgateway:9091
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./:/app
      - ${DVC_REMOTE_DIR:-./.dvc-remote}:/dvc-store   # DVC remote (outside the repo)
    ports: ["8265:8265", "4040:4040"]
    shm_size: 1gb
    depends_on: {mlflow: {condition: service_healthy}}
    mem_limit: 6g

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: [--config.file=/etc/alertmanager/alertmanager.yml]
    volumes: [./monitoring/alertmanager:/etc/alertmanager:ro]
    ports: ["9093:9093"]
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports: ["9091:9091"]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: [--path.rootfs=/host]
    volumes: ["/:/host:ro,rslave"]
    pid: host
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:
